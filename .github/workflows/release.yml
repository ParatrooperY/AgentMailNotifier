name: Release

# 推送 v 开头的 tag 时触发，例如 git push origin v0.1.1
on:
  push:
    tags:
      - "v*"
  # 也可以在 Actions 页面手动点按钮跑，用于重试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 依赖的编译结果，第二次之后构建能快很多
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run build
          npm test

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run tauri build

      # tauri 产出的文件名带空格和版本号，改成下载链接友好的名字
      - name: Collect artifacts
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp "src-tauri/target/release/bundle/nsis/Agent Mail Notifier_${version}_x64-setup.exe" \
             "artifacts/AgentMailNotifier-${version}-x64-setup.exe"
          cp "src-tauri/target/release/agent-mail-notifier.exe" \
             "artifacts/AgentMailNotifier-${version}-x64-portable.exe"
          ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true

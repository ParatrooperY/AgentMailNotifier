name: Release

# 推送 v 开头的 tag 时触发，例如 git push origin v0.1.1
on:
  push:
    tags:
      - "v*"
  # 也可以在 Actions 页面手动点按钮跑，用于重试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 产物文件名由 tauri.conf.json 的 version 决定，与 tag 不一致会拿错文件，
      # 所以先挡在这里，报一句能看懂的错，而不是等到最后找不到文件
      - name: Check the tag matches the configured version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$configured" ]; then
            echo "tag v$tag 与 src-tauri/tauri.conf.json 里的 $configured 不一致"
            echo "先把三个文件的版本号改成 $tag 并提交，再重新打 tag"
            exit 1
          fi
          echo "版本一致：$configured"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 依赖的编译结果，第二次之后构建能快很多
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run build
          npm test

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run tauri build

      # tauri 产出的文件名带空格和版本号，改成下载链接友好的名字
      - name: Collect artifacts
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p artifacts
          # 按配置版本精确匹配，避免目录里留有旧版本产物时挑错文件
          setup=$(ls src-tauri/target/release/bundle/nsis/*_"${version}"_*-setup.exe)
          cp "$setup" "artifacts/AgentMailNotifier-${version}-x64-setup.exe"
          cp "src-tauri/target/release/agent-mail-notifier.exe" \
             "artifacts/AgentMailNotifier-${version}-x64-portable.exe"
          ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          body_path: docs/RELEASE_NOTES.md
      - name: Verify release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,body,assets > "$RUNNER_TEMP/release.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const release = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'release.json'), 'utf8'));
          const normalize = text => text.replace(/\r\n/g, '\n').trim();
          const notes = normalize(fs.readFileSync('docs/RELEASE_NOTES.md', 'utf8'));
          const version = require('./src-tauri/tauri.conf.json').version;
          const expected = [`AgentMailNotifier-${version}-x64-setup.exe`, `AgentMailNotifier-${version}-x64-portable.exe`];
          if (release.tagName !== `v${version}` || !release.isDraft || normalize(release.body) !== notes) {
            throw new Error('Release tag, draft status or release notes do not match.');
          }
          if (!expected.every(name => release.assets.some(asset => asset.name === name && asset.size > 0))) {
            throw new Error('Release draft is missing an expected installer or portable executable.');
          }
          console.log('Verified release draft, bilingual notes and both Windows downloads.');
          NODE
